# Applies new files in supabase/migrations/ to the live database whenever they reach main, so nobody has to run
# `supabase db push` by hand. Needs two repository secrets (README → Setup → 1. Supabase):
#   SUPABASE_ACCESS_TOKEN  personal access token of an account that can manage the project
#   SUPABASE_DB_PASSWORD   the project's database password
#   and repository variable SUPABASE_PROJECT_ID (the project ref). Without them the job is skipped.
# Run it by hand too: Actions → Database migrations → Run workflow.
name: Database migrations
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
concurrency: { group: db-migrations, cancel-in-progress: false }
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Skipped: add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (secrets) and SUPABASE_PROJECT_ID (variable) in GitHub → Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with: { version: latest }
      - if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply new migrations (already-applied ones are skipped)
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --linked
